[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
# Express serves "ok" at / — lets Railway confirm the service booted.
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/app/auth"
name = "whatsapp-auth"

[[deploy.volumes]]
mountPath = "/app/data"
name = "bot-data"
